<article class="day-card">
  <div class="day-header">
    <div>
      <span class="date-row">
        <span class="date">{{ formattedDate }}</span>
        <span class="weekday">{{ dayOfWeek }}</span>
      </span>
      <div class="city">{{ day.city }}</div>
    </div>
    <div class="locations">
      <span class="pill">старт: {{ day.startLocation || '—' }}</span>
      <span class="pill">финиш: {{ day.endLocation || '—' }}</span>
    </div>
  </div>

  <div class="day-variants day-body" *ngIf="variants && variants.length > 0">
    <tui-textfield>
      <select tuiSelect
        [(ngModel)]="selectedVariantId"
        [items]="variantIds"
        [labels]="variantLabels"
        placeholder="Вариант дня"
      ></select>
    </tui-textfield>
  </div>

  <div class="day-body">
    <app-schedule-item *ngFor="let item of displayedSchedule" [item]="item"></app-schedule-item>
  </div>
</article>
