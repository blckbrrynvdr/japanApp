<section class="budget-card">
  <h2>Бюджет</h2>
  <table>
    <thead>
      <tr>
        <th>Категория</th>
        <th>План</th>
        <th>Факт</th>
        <th>Комментарий</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of budget.items">
        <td>{{ item.category }}</td>
        <td>{{ item.planned }}</td>
        <td>{{ item.actual ?? '—' }}</td>
        <td>{{ item.comment ?? '—' }}</td>
      </tr>
    </tbody>
    <tfoot>
      <tr>
        <td>Итого</td>
        <td>{{ totalPlanned }}</td>
        <td>{{ totalActual }}</td>
        <td></td>
      </tr>
    </tfoot>
  </table>
</section>
