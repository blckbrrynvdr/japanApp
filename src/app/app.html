<tui-root>
  <div class="app-shell" *ngIf="config$ | async as config">
    <header class="hero">
      <div class="hero-copy">
        <p class="eyebrow">План поездки</p>
        <h1>{{ config.appContext }}</h1>
        <p class="hero-description">{{ config.agentInstructions }}</p>
      </div>
    </header>

    <section class="content">
      <div class="section-heading">
        <h2>Маршрут</h2>
        <p>Дни путешествия с расписанием, локациями и дополнительными заметками.</p>
      </div>

      <div class="day-grid">
        <app-day-card *ngFor="let day of config.days" [day]="day"></app-day-card>
      </div>

      <div class="two-column-grid">
        <app-budget [budget]="config.budget"></app-budget>
        <app-payments [payments]="config.payments"></app-payments>
      </div>

      <div class="two-column-grid">
        <app-shopping [shopping]="config.shopping"></app-shopping>
        <app-souvenir-tips [souvenirTips]="config.souvenirTips"></app-souvenir-tips>
      </div>

      <div class="two-column-grid">
        <app-checklist [checklist]="config.checklist"></app-checklist>
        <app-links [links]="config.links"></app-links>
      </div>
    </section>
  </div>
</tui-root>
